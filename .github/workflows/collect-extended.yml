name: collect-extended

on:
  schedule:
    # :47 past the hour, every 3 hours — offset from collect.yml's :17 so the
    # two workflows' commits don't race each other.
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-extended
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect quotes (extended)
        run: python scripts/collect.py --tier extended

      - name: Commit snapshot
        run: |
          git config user.name "remit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data (extended): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
